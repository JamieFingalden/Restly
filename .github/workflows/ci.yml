name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer

jobs:
  test:
    name: 测试 (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 查看构建环境
        run: |
          xcodebuild -version
          swift --version
      - name: 运行测试
        run: swift test

  build:
    name: 构建并校验通用 DMG
    needs: test
    runs-on: macos-26
    timeout-minutes: 20
    env:
      RESTLY_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # build.sh 用 git rev-list --count 派生构建号，浅克隆（默认 depth=1）
          # 会让 CI 里计数恒为 1、构建号退化——构建任务必须拉全量历史。
          fetch-depth: 0
      - name: 构建安装包
        run: ./scripts/build.sh
      - name: 校验安装包
        run: ./scripts/verify-release.sh
      - name: 保存安装包与校验和
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Restly-universal
          path: |
            dist/Restly.dmg
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    name: 发布 Release
    if: startsWith(github.ref, 'refs/tags/') && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: 下载已校验的安装包
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Restly-universal
          path: dist
      - name: 核对下载文件的校验和
        working-directory: dist
        run: sha256sum -c SHA256SUMS.txt
      - name: 上传安装包并发布
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > release-state.txt; then
            if [[ "$(cat release-state.txt)" != "true" ]]; then
              echo "此版本已发布，拒绝覆盖已有安装包。" >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Restly $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" dist/Restly.dmg dist/SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
